theme: jekyll-theme-Architect
encoding: utf-8
title: 一个人的对冲基金
description: AI为个体赋能
favicon: /favicon.ico

# 1. 声明启用分页插件
plugins:
  - jekyll-paginate

# 2. 分页核心参数设置
paginate: 20
paginate_path: "/page:num/"

# Fulcrum 子目录博文（Obsidian → GitHub Pages）
defaults:
  - scope:
      path: "fulcrum"
      type: "pages"
    values:
      layout: "fulcrum-post"
  - scope:
      path: "fulcrum/index.html"
      type: "pages"
    values:
      layout: "fulcrum-home"
